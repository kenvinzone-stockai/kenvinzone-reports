<script>
  /* Sync Kenvinzone Dark/Light theme across kenvinzone.com, aurora.kenvinzone.com & prop.kenvinzone.com */
  (function(){
    try{
      var m=document.cookie.match(/(?:^|; )kz-theme=(light|dark)/);
      var t=m?m[1]:localStorage.getItem("kz-theme");
      if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
    }catch(e){}
  })();
</script>

  /* ========== LAYOUT ========== */

  /* ========== SIDEBAR CONTROLS (COMPACT & CRISP) ========== */
  .sidebar-top {

  .hero-pill.bullish { color: var(--kz-green); background: var(--kz-green-soft); border-color: rgba(52,211,153,0.35); }
  .hero-pill.bearish { color: var(--kz-rose); background: var(--kz-rose-soft); border-color: rgba(251,113,133,0.35); }
  .hero-pill.neutral { color: var(--kz-cyan); background: var(--kz-cyan-soft); border-color: rgba(56,213,231,0.35); }
  .hero-pill.conf-high { color: var(--kz-gold); background: var(--kz-gold-soft); border-color: rgba(243,190,98,0.4); }
  .hero-pill.conf-medium { color: var(--kz-cyan); background: var(--kz-cyan-soft); border-color: rgba(56,213,231,0.35); }

  .hero-headline {
    font-size: 16.5px; font-weight: 700; color: var(--kz-strong); margin-bottom: 8px; max-width: 740px;
  }
  .hero-meta {
    display: flex; gap: 15px; flex-wrap: wrap; font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--kz-muted); margin-bottom: 12px;
  }
  .hero-insight {
    color: var(--kz-text2); line-height: 1.72; max-width: 740px; font-size: 14px;
    padding-left: 14px; border-left: 3px solid rgba(56, 213, 231, 0.45);
  }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

  .kz-btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 10px;
    font-size: 12.5px; font-weight: 700; cursor: pointer; border: 1px solid var(--kz-line2);
    background: var(--kz-surface2); color: var(--kz-strong); position: relative; overflow: hidden;
    transition: transform 0.18s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .kz-btn:hover { transform: translateY(-1px); border-color: var(--kz-cyan); }
  .kz-btn.primary {
    border: 0; background: linear-gradient(135deg, #0284c7 0%, #38d5e7 100%); color: #04131c;
  }
  .kz-btn.primary:hover { box-shadow: 0 10px 24px -8px rgba(56, 213, 231, 0.55); }
  .kz-btn.gold {
    border: 0; background: linear-gradient(135deg, #e59d24 0%, #f3be62 100%); color: #211400;
  }

  .hero-price {
    text-align: right; background: var(--kz-surface2); border: 1px solid var(--kz-line);
    border-radius: 15px; padding: 16px 20px; min-width: 215px;
  }
  .hero-price-label {
    font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700;
    color: var(--kz-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
  }
  .hero-price-value {
    font-family: "JetBrains Mono", monospace; font-size: 38px; font-weight: 800;
    color: var(--kz-gold); line-height: 1.05; letter-spacing: -0.02em;
  }
  .hero-price-time { margin-top: 6px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--kz-muted); }
  .hero-sparkline { margin-top: 12px; height: 34px; width: 170px; margin-left: auto; display: block; }

  /* ========== 4-TIMEFRAME ALIGNMENT RADAR STRIP ========== */
  .mtf-radar {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
  }
  .mtf-card {
    background: var(--kz-surface); border: 1px solid var(--kz-line); border-radius: var(--radius);
    padding: 14px 15px; position: relative; overflow: hidden;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .mtf-card:hover { transform: translateY(-2px); border-color: var(--kz-line2); }
  .mtf-card.bullish { border-top: 3px solid var(--kz-green); }
  .mtf-card.bearish { border-top: 3px solid var(--kz-rose); }
  .mtf-card.neutral { border-top: 3px solid var(--kz-cyan); }
  .mtf-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .mtf-tf { font-family: "JetBrains Mono", monospace; font-size: 15px; font-weight: 800; color: var(--kz-strong); }
  .mtf-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .mtf-mini {
    font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 6px; background: var(--kz-surface2);
    border: 1px solid var(--kz-line); color: var(--kz-text2);
  }
  .mtf-desc { font-size: 12px; color: var(--kz-muted); line-height: 1.5; }

  /* ========== PANELS & SPOTLIGHT ========== */
  .panel {
    position: relative; overflow: hidden; isolation: isolate;
    background: var(--kz-surface); border: 1px solid var(--kz-line);
    border-radius: var(--radius-lg); box-shadow: var(--kz-shadow);
  }
  .panel::before, .scenario-card::before, .mtf-card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    opacity: 0; transition: opacity 0.28s ease; z-index: -1;
    background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 50%), rgba(56, 213, 231, 0.12), transparent 62%);
  }
  .panel:hover::before, .scenario-card:hover::before, .mtf-card:hover::before { opacity: 1; }

  .panel-body { padding: 22px 24px; }
  .panel-title {
    font-size: 11.5px; font-weight: 800; color: var(--kz-cyan); letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 16px; display: flex; gap: 10px; align-items: center;
  }
  .panel-title::before {
    content: ""; width: 3px; height: 15px; border-radius: 2px;
    background: linear-gradient(180deg, var(--kz-cyan) 0%, var(--kz-gold) 100%);
  }

  /* ========== FLAGSHIP SCENARIO COMMAND STAGE (ASYMMETRIC + MOTION GRAPHIC) ========== */
  .scenarios-stage {
    display: grid;
    grid-template-columns: 1.42fr 1fr;
    gap: 16px;
    align-items: stretch;
  }
  .scenarios-secondary {
    display: grid;
    gap: 14px;
    align-content: stretch;
  }

  /* Primary Spotlight Card */
  .sc-primary-wrap {
    position: relative;
    border-radius: 17px;
    padding: 1.5px;
    background: linear-gradient(135deg, rgba(243,190,98,0.55), rgba(56,213,231,0.35) 55%, rgba(243,190,98,0.2));
    overflow: hidden;
    display: flex;
  }
  .sc-primary-wrap.tier-high {
    background: linear-gradient(135deg, #38d5e7, #34d399 50%, #f3be62);
    box-shadow: 0 0 36px -10px rgba(56, 213, 231, 0.45);
  }
  .sc-primary-wrap.tier-ultra {
    background: transparent;
    box-shadow: 0 0 46px -8px rgba(243, 190, 98, 0.55), 0 0 24px -8px rgba(52, 211, 153, 0.4);
  }
  .sc-primary-wrap.tier-ultra::before {
    content: "";
    position: absolute;
    inset: -60%;
    background: conic-gradient(from 0deg, #34d399, #38d5e7, #f3be62, #fb7185, #34d399);
    animation: kzOrbitBorder 4.5s linear infinite;
    z-index: 0;
  }
  @keyframes kzOrbitBorder { to { transform: rotate(360deg); } }

  .sc-primary-card {
    position: relative;
    z-index: 1;
    width: 100%;
    border-radius: 16px;
    padding: 22px 22px 20px;
    background: linear-gradient(155deg, rgba(16, 29, 53, 0.98) 0%, rgba(9, 19, 36, 0.99) 100%);
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow: hidden;
    isolation: isolate;
    transition: transform 0.22s var(--ease-out);
  }
  html[data-theme="light"] .sc-primary-card {
    background: linear-gradient(155deg, #ffffff 0%, #f5f9ff 100%);
  }
  .sc-primary-card::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background: radial-gradient(420px circle at var(--mx, 20%) var(--my, 20%), rgba(243, 190, 98, 0.14), transparent 60%);
  }
  .sc-primary-wrap.tier-ultra .sc-primary-card::after {
    background: radial-gradient(480px circle at 85% 15%, rgba(52, 211, 153, 0.16), transparent 55%),
                radial-gradient(420px circle at var(--mx, 20%) var(--my, 20%), rgba(243, 190, 98, 0.16), transparent 60%);
  }

  .sc-top-bar {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  }
  .sc-conviction-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px; border-radius: 999px;
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; font-weight: 800;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .sc-conviction-pill.ultra {
    background: linear-gradient(135deg, #e59d24, #f3be62); color: #1f1300;
    box-shadow: 0 0 18px rgba(243, 190, 98, 0.6);
    animation: kzPulseGlow 2.2s ease-in-out infinite;
  }
  .sc-conviction-pill.high {
    background: linear-gradient(135deg, #0284c7, #38d5e7); color: #04131c;
    box-shadow: 0 0 16px rgba(56, 213, 231, 0.5);
  }
  .sc-conviction-pill.mod {
    background: var(--kz-gold-soft); color: var(--kz-gold); border: 1px solid rgba(243,190,98,0.4);
  }
  @keyframes kzPulseGlow {
    0%, 100% { box-shadow: 0 0 14px rgba(243, 190, 98, 0.55); transform: scale(1); }
    50% { box-shadow: 0 0 26px rgba(243, 190, 98, 0.85); transform: scale(1.02); }
  }

  .sc-bias-hero {
    font-size: clamp(20px, 2.2vw, 25px); font-weight: 800; letter-spacing: -0.02em;
    margin-top: 8px; display: flex; align-items: center; gap: 8px;
  }
  .sc-bias-hero.bullish { color: var(--kz-green); }
  .sc-bias-hero.bearish { color: var(--kz-rose); }
  .sc-bias-hero.neutral { color: var(--kz-cyan); }

  /* Circular Probability Ring Gauge */
  .prob-ring-box {
    position: relative; width: 88px; height: 88px; flex-shrink: 0;
    display: grid; place-items: center;
  }
  .prob-ring-svg { width: 88px; height: 88px; transform: rotate(-90deg); }
  .prob-ring-bg { fill: none; stroke: var(--kz-line); stroke-width: 7; }
  .prob-ring-fg {
    fill: none; stroke-width: 7; stroke-linecap: round;
    transition: stroke-dashoffset 1.1s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .prob-ring-text {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .prob-ring-num { font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 800; line-height: 1; color: var(--kz-strong); }
  .prob-ring-lbl { font-family: "JetBrains Mono", monospace; font-size: 8.5px; color: var(--kz-muted); text-transform: uppercase; margin-top: 3px; letter-spacing: 0.06em; }

  .sc-setup-box {
    padding: 13px 15px; border-radius: 12px;
    background: var(--kz-surface2); border: 1px solid var(--kz-line);
    border-left: 3px solid var(--kz-gold);
    font-size: 13.5px; color: var(--kz-text); line-height: 1.65;
  }

  /* Visual Trade Plan Trajectory Strip (SL -- Entry -- TP) */
  .trade-visual {
    padding: 12px 14px; border-radius: 12px;
    background: rgba(7, 15, 29, 0.55); border: 1px solid var(--kz-line);
  }
  html[data-theme="light"] .trade-visual { background: var(--kz-surface2); }
  .trade-vis-labels {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px;
  }
  .tv-cell { display: flex; flex-direction: column; gap: 2px; }
  .tv-cell.center { text-align: center; }
  .tv-cell.right { text-align: right; }
  .tv-k { font-family: "JetBrains Mono", monospace; font-size: 9.5px; color: var(--kz-subtle); text-transform: uppercase; letter-spacing: 0.06em; }
  .tv-v { font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 800; }
  .tv-v.sl { color: var(--kz-rose); }
  .tv-v.rr { color: var(--kz-gold); }
  .tv-v.tp { color: var(--kz-green); }

  .tv-track {
    position: relative; height: 8px; border-radius: 999px; overflow: hidden;
    background: var(--kz-deep); border: 1px solid var(--kz-line);
    display: flex;
  }
  .tv-risk-seg { width: 32%; background: linear-gradient(90deg, rgba(251,113,133,0.85), rgba(251,113,133,0.35)); }
  .tv-reward-seg {
    flex: 1; background: linear-gradient(90deg, rgba(56,213,231,0.5), #34d399);
    position: relative; overflow: hidden;
  }
  .tv-reward-seg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: translateX(-100%);
    animation: kzFlowSweep 2.4s ease-in-out infinite;
  }
  @keyframes kzFlowSweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .sc-primary-foot {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: auto; padding-top: 4px;
  }

  /* Secondary Tactical Cards (Alternative & Invalidation) */
  .scenario-card {
    position: relative; overflow: hidden; isolation: isolate;
    background: var(--kz-surface2); border: 1px solid var(--kz-line);
    border-radius: var(--radius); padding: 16px 17px; display: flex; flex-direction: column; gap: 9px;
    transition: transform 0.22s var(--ease-out), border-color 0.2s ease, box-shadow 0.2s ease;
    will-change: transform;
  }
  .scenario-card.alternative { border-left: 3px solid var(--kz-cyan); }
  .scenario-card.invalidation { border-left: 3px solid var(--kz-rose); }

  .sc-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .scenario-type {
    font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 800;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .scenario-type.alternative { color: var(--kz-cyan); }
  .scenario-type.invalidation { color: var(--kz-rose); }
  .sc-sec-prob {
    font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 800;
    padding: 2px 9px; border-radius: 999px; background: var(--kz-surface); border: 1px solid var(--kz-line2);
  }

  .scenario-bias { font-size: 14.5px; font-weight: 800; }
  .scenario-bias.bullish { color: var(--kz-green); }
  .scenario-bias.bearish { color: var(--kz-rose); }
  .scenario-bias.neutral { color: var(--kz-cyan); }
  .scenario-setup { font-size: 12.5px; color: var(--kz-text2); line-height: 1.55; flex: 1; }

  .scenario-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    padding: 8px 0; border-top: 1px dashed var(--kz-line); border-bottom: 1px dashed var(--kz-line);
  }
  .stat-label { font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--kz-subtle); text-transform: uppercase; }
  .stat-value { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 800; margin-top: 2px; word-break: break-word; }
  .stat-value.green { color: var(--kz-green); }
  .stat-value.red { color: var(--kz-rose); }
  .stat-value.gold { color: var(--kz-gold); }

  .prob-track { height: 6px; border-radius: 999px; background: var(--kz-deep); overflow: hidden; border: 1px solid var(--kz-line); }
  .prob-fill { height: 100%; width: 0%; border-radius: 999px; transition: width 0.9s var(--ease-out); }
  .prob-fill.alternative { background: linear-gradient(90deg, #0284c7, #38d5e7); }
  .prob-fill.invalidation { background: linear-gradient(90deg, #e11d48, #fb7185); }

  /* ========== VISUAL PRICE LADDER & GRIDS ========== */
  .dual-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .triple-grid { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 18px; }

  .ladder { display: grid; gap: 8px; }
  .ladder-row {
    display: grid; grid-template-columns: 10px 92px 1fr auto; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 10px; background: var(--kz-surface2); border: 1px solid var(--kz-line);
  }
  .ladder-row.current {
    border-color: var(--kz-gold); background: linear-gradient(90deg, var(--kz-gold-soft), var(--kz-surface2));
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot.resistance { background: var(--kz-rose); box-shadow: 0 0 8px var(--kz-rose); }
  .dot.current { background: var(--kz-gold); box-shadow: 0 0 10px var(--kz-gold); }
  .dot.support { background: var(--kz-green); box-shadow: 0 0 8px var(--kz-green); }
  .dot.ref { background: var(--kz-cyan); }
  .level-type { font-size: 11.5px; font-weight: 700; color: var(--kz-muted); }
  .level-bar-wrap { height: 6px; border-radius: 999px; background: var(--kz-deep); overflow: hidden; }
  .level-bar { height: 100%; border-radius: 999px; }
  .level-price { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 800; color: var(--kz-strong); }

  .list-stack { display: grid; gap: 9px; }
  .list-item {
    padding: 11px 13px; border-radius: 10px; background: var(--kz-surface2);
    border: 1px solid var(--kz-line); font-size: 13px; color: var(--kz-text2); line-height: 1.55;
  }
  .list-item.bull { border-left: 3px solid var(--kz-green); }
  .list-item.bear { border-left: 3px solid var(--kz-rose); }
  .list-item.risk { border-left: 3px solid var(--kz-gold); background: rgba(243,190,98,0.05); }

  /* ========== EXECUTION & CHECKLIST ========== */
  .exec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 11px; margin-bottom: 16px; }
  .exec-card {
    background: var(--kz-surface2); border: 1px solid var(--kz-line); border-radius: 11px; padding: 13px 14px;
  }
  .exec-key {
    font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700;
    color: var(--kz-cyan); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px;
  }
  .exec-val { font-size: 13px; color: var(--kz-strong); line-height: 1.5; }

  .checklist { display: grid; gap: 8px; }
  .check {
    display: flex; align-items: flex-start; gap: 11px; padding: 11px 13px; border-radius: 11px;
    background: var(--kz-surface2); border: 1px solid var(--kz-line); cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .check:hover { border-color: var(--kz-cyan); }
  .check.checked { border-color: rgba(52,211,153,0.45); background: var(--kz-green-soft); }
  .check-box {
    width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--kz-line2);
    display: grid; place-items: center; font-size: 12px; font-weight: 900; color: transparent; flex-shrink: 0;
  }
  .check.checked .check-box { background: var(--kz-green); border-color: var(--kz-green); color: #04131c; }
  .check.checked .check-text { text-decoration: line-through; opacity: 0.72; }
  .check-text { font-size: 13px; color: var(--kz-text); }

  /* ========== MATRIX TABLE ========== */
  .matrix-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--kz-line); }
  table.matrix { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 680px; }
  table.matrix th, table.matrix td { padding: 11px 13px; text-align: left; border-bottom: 1px solid var(--kz-line); vertical-align: top; }
  table.matrix thead th {
    background: var(--kz-surface2); color: var(--kz-muted);
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
  }
  table.matrix tbody tr:last-child td { border-bottom: 0; }
  table.matrix tbody tr:hover { background: var(--kz-surface-hover); }

  /* ========== ECOSYSTEM CROSS-LINK BANNER ========== */
  .eco-strip {
    border-radius: var(--radius-lg); padding: 20px 24px;
    background: linear-gradient(135deg, rgba(16,29,53,0.95) 0%, rgba(10,20,38,0.98) 60%, rgba(13,42,60,0.95) 100%);
    border: 1px solid rgba(56, 213, 231, 0.32);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
    color: #e6eef8;
  }

  /* ========== SKELETON & EMPTY ========== */
  .skeleton-stack { display: grid; gap: 18px; }
  .skel {
    background: linear-gradient(90deg, var(--kz-surface) 0%, var(--kz-surface-hover) 50%, var(--kz-surface) 100%);
    background-size: 200% 100%; animation: shimmer 1.5s ease infinite; border-radius: var(--radius);
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .empty {
    min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--kz-muted); text-align: center; padding: 24px;
  }

  /* ========== MOBILE BOTTOM SHEET, FAB, TOAST, SPARKLE ========== */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(4, 10, 20, 0.68); backdrop-filter: blur(4px);
    z-index: 120; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .bottom-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 84vh; z-index: 130;
    background: var(--kz-deep); border-top: 1px solid var(--kz-line2);
    border-radius: 22px 22px 0 0; transform: translateY(100%); transition: transform 0.3s var(--ease-out);
    display: flex; flex-direction: column; padding-bottom: var(--safe-bottom);
  }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-handle { width: 42px; height: 4px; border-radius: 99px; background: var(--kz-line2); margin: 10px auto 4px; cursor: grab; }
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 18px 12px; border-bottom: 1px solid var(--kz-line);
  }
  .sheet-title { font-weight: 800; font-size: 15px; color: var(--kz-strong); }
  .sheet-close {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--kz-line);
    background: var(--kz-surface); color: var(--kz-text); cursor: pointer;
  }

function L(key) {
  const dict = I18N[currentLang] || I18N.vi;
  return dict[key] !== undefined ? dict[key] : I18N.vi[key];
}

function applyStaticLang() {
  document.documentElement.lang = currentLang;
  document.title = currentLang === 'en'
    ? 'KenvinZone 4H Strategy Desk · Auto Trading Scenarios (XAUUSD & NQ)'
    : 'KenvinZone Bảng Chiến Lược 4H · Kịch Bản Giao Dịch Tự Động (XAUUSD & NQ)';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    const v = L(k);
    if (typeof v === 'string') el.textContent = v;
  });
  const advT = document.getElementById('advFilterToggle');
  const advB = document.getElementById('advFiltersBox');
  if (advT && advB) advT.textContent = advB.classList.contains('collapsed') ? L('moreFilters') : L('lessFilters');
  const si = document.getElementById('searchInput');
  if (si) si.placeholder = L('searchPh');
  const st = document.querySelector('.sheet-title');
  if (st) st.textContent = L('sheetTitle');
  const lb = document.getElementById('langToggle');
  if (lb) {
    lb.textContent = currentLang === 'en' ? 'VI' : 'EN';
    lb.title = currentLang === 'en' ? 'Chuyển sang Tiếng Việt' : 'Switch to English';
  }

function setLang(next) {
  currentLang = next === 'en' ? 'en' : 'vi';
  try { localStorage.setItem('kz-lang', currentLang); } catch(_) {}
  try {
    const domainAttr = /\.?kenvinzone\.com$/i.test(location.hostname) ? '; domain=.kenvinzone.com' : '';
    document.cookie = `kz-lang=${currentLang}; path=/${domainAttr}; max-age=31536000; SameSite=Lax`;
  } catch(_) {}
  applyStaticLang();
  updateMonthSelector();
  renderFilters();
  renderList();
  renderContent();
  if (allReports.length) document.getElementById('lastUpdated').textContent = fmtRelativeTime(allReports[0].datetime);
}

const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

(function initThemeAndMotion(){
  const btn = document.getElementById('themeToggle');
  if (btn) {
    btn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('kz-theme', next); } catch(_) {}
      try {
        const domainAttr = /\.?kenvinzone\.com$/i.test(location.hostname) ? '; domain=.kenvinzone.com' : '';
        document.cookie = `kz-theme=${next}; path=/${domainAttr}; max-age=31536000; SameSite=Lax`;
      } catch(_) {}
    });
  }

  // Scroll Progress Telemetry Beam
  const beam = document.getElementById('kzScrollBeam');
  let ticking = false;
  window.addEventListener('scroll', () => {
    const topBtn = document.getElementById('scrollTop');
    if (topBtn) topBtn.classList.toggle('visible', window.scrollY > 320);
    if (!ticking && beam) {
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        beam.style.transform = `scaleX(${Math.min(1, Math.max(0, window.scrollY / max)).toFixed(4)})`;
      });
    }
  }, { passive: true });

  // Pointer Spotlight + 3D Tilt on Scenario Cards
  if (!prefersReduced) {
    document.addEventListener('pointermove', (e) => {
      const card = e.target && e.target.closest ? e.target.closest('.panel, .scenario-card, .mtf-card') : null;
      if (!card) return;
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left).toFixed(1) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top).toFixed(1) + 'px');
      if (card.classList.contains('scenario-card') && window.innerWidth >= 960) {

      }

    document.addEventListener('pointerout', (e) => {

function spawnSparkles(x, y) {
  if (prefersReduced) return;
  const colors = ['#38D5E7', '#F3BE62', '#34D399', '#FFFFFF'];
  for (let i = 0; i < 12; i++) {
    const dot = document.createElement('span');
    dot.className = 'kz-sparkle';
    dot.style.left = (x || window.innerWidth / 2) + 'px';
    dot.style.top = (y || window.innerHeight / 2) + 'px';
    dot.style.background = colors[i % colors.length];
    document.body.appendChild(dot);
    const a = (Math.PI * 2 * i) / 12 + (Math.random() - 0.5) * 0.4;
    const d = 28 + Math.random() * 40;
    requestAnimationFrame(() => {
      dot.style.transform = `translate3d(${(Math.cos(a)*d).toFixed(1)}px, ${(Math.sin(a)*d - 10).toFixed(1)}px, 0) scale(0)`;
      dot.style.opacity = '0';
    });
    setTimeout(() => dot.remove(), 600);
  }
}

let heroCanvasRaf = null;
function startHeroFlowCanvas() {
  if (heroCanvasRaf) cancelAnimationFrame(heroCanvasRaf);
  const canvas = document.getElementById('kzHeroCanvas');
  if (!canvas || prefersReduced) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  let phase = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w <= 0 || h <= 0) return;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function drawWave(w, h, yFrac, amp, freq, spd, color) {
    ctx.beginPath();
    for (let i = 0; i <= 42; i++) {
      const u = i / 42;
      const x = u * w;
      const y = yFrac * h + Math.sin(u * freq + phase * spd) * amp + Math.cos(u * freq * 0.5 - phase * 0.6) * (amp * 0.45);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color; ctx.lineWidth = 1.3; ctx.stroke();
  }
  function loop() {
    if (!document.body.contains(canvas)) return;
    if (!document.hidden) {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (w > 0 && h > 0) {
        ctx.clearRect(0, 0, w, h);
        phase += 0.013;
        drawWave(w, h, 0.35, 18, 5.0, 1.0, 'rgba(56, 213, 231, 0.16)');
        drawWave(w, h, 0.62, 22, 4.2, -0.8, 'rgba(243, 190, 98, 0.12)');
        drawWave(w, h, 0.80, 14, 6.0, 0.7, 'rgba(52, 211, 153, 0.10)');
      }
    }
    heroCanvasRaf = requestAnimationFrame(loop);
  }
  resize();
  loop();
}

// DATA UTILS (100% COMPATIBLE WITH MAKE.COM + CLAUDE JSON)
// ============================================================
function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeStr(v, fallback='—') {
  if (v === null || v === undefined || v === '') return fallback;
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}
function safeObj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
function safeArr(v) {
  if (Array.isArray(v)) return v;
  if (typeof v === 'string' && v.trim()) return [v];
  if (v && typeof v === 'object') return Object.values(v);
  return [];
}
function normalizeInstrument(inst) {
  const s = String(inst || '').toUpperCase();
  if (!s) return 'N/A';
  if (s.includes('XAU')) return 'XAUUSD';
  if (s.includes('NQ') || s.includes('US100') || s.includes('NAS') || s.includes('USTEC') || s.includes('USATEC')) return 'NQ / US100';
  if (s.includes('VN') || s.includes('VNINDEX')) return 'VNINDEX';
  return inst;
}
function getBiasClass(bias) {
  const b = String(bias || '').toLowerCase();
  if (b.includes('bull') || b.includes('long') || b.includes('tăng') || b.includes('mua')) return 'bullish';
  if (b.includes('bear') || b.includes('short') || b.includes('giảm') || b.includes('bán')) return 'bearish';
  return 'neutral';
}
function getBiasIcon(cls) { return cls === 'bullish' ? '▲' : cls === 'bearish' ? '▼' : '◆'; }
function getConfidenceClass(v) {
  if (typeof v === 'number') return v >= 70 ? 'conf-high' : v >= 45 ? 'conf-medium' : 'conf-low';
  const s = String(v || '').toLowerCase();
  if (s.includes('high') || s.includes('strong') || s.includes('cao')) return 'conf-high';
  if (s.includes('med') || s.includes('trung')) return 'conf-medium';
  return 'conf-low';
}
function fmtTs(ts) {
  try {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return String(ts);
    return d.toLocaleString('vi-VN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch { return String(ts); }
}
function fmtRelativeTime(ts) {
  try {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return L('justNow');
    if (diff < 3600) return L('minsAgo')(Math.floor(diff/60));
    if (diff < 86400) return L('hrsAgo')(Math.floor(diff/3600));
    if (diff < 604800) return L('daysAgo')(Math.floor(diff/86400));
    return fmtTs(ts);
  } catch { return '—'; }
}
function fmtPrice(v) {
  const n = Number(v);
  if (Number.isFinite(n)) return n.toLocaleString('en-US', { minimumFractionDigits:0, maximumFractionDigits:2 });
  return safeStr(v);
}
function probValue(v) {
  if (v === null || v === undefined || v === '') return 0;
  const n = Number(v);
  if (!Number.isNaN(n)) return n > 1 ? n : n * 100;
  const m = String(v).match(/(\d+(\.\d+)?)/);
  return m ? Number(m[1]) : 0;
}
function textArray(v) {
  return safeArr(v).map(item => {
    if (typeof item === 'object') return safeStr(item.factor || item.description || item.name || item.title || item.event || item);
    return safeStr(item);
  });
}
function getMonthKey(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function getMonthLabel(key) {
  const [y, m] = key.split('-');
  return L('monthFmt')(parseInt(m), y);
}

function normalizeScenario(key, v) {
  const s = safeObj(v);
  if (!Object.keys(s).length) return null;
  return {
    key,
    bias: safeStr(s.bias || s.direction || s.type || key),
    setup: safeStr(s.setup || s.condition || s.trigger || s.description || s.action || '—'),
    target: Array.isArray(s.target) ? s.target.map(fmtPrice).join(' → ') : safeStr(s.target || s.targets || s.take_profit || s.tp || '—'),
    stop: fmtPrice(s.stop_loss || s.stop || s.sl || '—'),
    rr: safeStr(s.risk_reward || s.rr || s.ratio || '—'),
    probability: probValue(s.probability || s.prob || 0)
  };
}

function normalizeReport(r) {
  let raw = r.raw !== undefined ? r.raw : r;
  if (typeof raw === 'string') {
    try { raw = JSON.parse(raw); } catch(e) { return null; }
  }
  if (!raw || typeof raw !== 'object') return null;

  const summary = safeObj(raw.summary || raw.executive_summary || raw.executiveSummary);
  const structure = safeObj(raw.market_structure || raw.multi_timeframe_analysis || raw.multiTimeframeAnalysis);
  const confluence = safeObj(raw.confluence_analysis || raw.bias_logic);
  const scenariosObj = safeObj(raw.trading_scenarios || raw.scenario_matrix || raw.scenarios);
  const execution = safeObj(raw.execution_plan || raw.trading_strategy);
  const keyLevels = safeObj(raw.key_levels || raw.keyLevels);
  const checklist = safeObj(raw.action_checklist || raw.actionChecklist);

  const instrument = normalizeInstrument(r.instrument || summary.instrument || raw.instrument || raw.metadata?.instrument);
  const price = Number(r.price_current || summary.current_price || keyLevels.currentPrice || keyLevels.current_price || 0);
  const bias = safeStr(summary.primary_bias || summary.bias_direction || summary.bias || raw.bias_primary || raw.bias || 'Neutral');
  const confidence = summary.confidence_level || summary.confidence || raw.confidence || raw.confidence_level || 'N/A';

  const tfRows = ['D1','H4','H1','M15'].map(tf => {
    const d = safeObj(structure[tf] || structure[tf.toLowerCase()]);
    if (!Object.keys(d).length) return null;
    return {
      tf,
      trend: safeStr(d.bias || d.trend || '—'),
      ema: safeStr(d.ema_alignment || '', ''),
      rsi: d.rsi_value ? `RSI ${Number(d.rsi_value).toFixed(1)}` : safeStr(d.rsi_zone || '', ''),
      macd: safeStr(d.macd_bias || '', ''),
      description: [
        safeStr(d.structure || '', ''),
        safeStr(d.intraday_story || '', ''),
        safeStr(d.key_levels || '', ''),
        safeStr(d.momentum || '', ''),
        safeStr(d.trigger_setup || '', '')
      ].filter(x => x && x !== '—').join(' · ')
    };
  }).filter(Boolean);

  const scenarios = [
    normalizeScenario('primary_scenario', scenariosObj.primary_scenario),
    normalizeScenario('alternative_scenario', scenariosObj.alternative_scenario),
    normalizeScenario('invalidation_scenario', scenariosObj.invalidation_scenario)
  ].filter(Boolean);

  const datetime = r.datetime || raw.timestamp || new Date().toISOString();

  return {
    id: r.id || `RPT-${Date.now()}`,
    instrument,
    price,
    priceFmt: fmtPrice(price),
    bias,
    biasClass: getBiasClass(bias),
    confidence,
    confidenceClass: getConfidenceClass(confidence),
    headline: safeStr(summary.headline || '', ''),
    insight: safeStr(summary.key_insight || summary.summary || raw.dashboard_summary || raw.telegram_summary || '—'),
    telegramSummary: safeStr(raw.telegram_summary || raw.dashboard_summary || '', ''),
    archetype: safeStr(r.archetype || raw.archetype || raw.metadata?.archetype || 'Chiến lược cập nhật 4H'),
    datetime,
    dateDisplay: r.date_display || fmtTs(datetime).split(' ')[0],
    timeDisplay: r.time_display || (fmtTs(datetime).split(' ')[1] || '—'),
    dateObj: new Date(datetime),
    monthKey: getMonthKey(datetime),
    resistanceNums: safeArr(keyLevels.resistance || structure.H4?.critical_levels?.resistance || []).map(Number).filter(Number.isFinite),
    supportNums: safeArr(keyLevels.support || structure.H4?.critical_levels?.support || []).map(Number).filter(Number.isFinite),
    swingHigh: Number(keyLevels.swing_high) || null,
    swingLow: Number(keyLevels.swing_low) || null,
    prevDayHigh: Number(keyLevels.prev_day_high) || null,
    prevDayLow: Number(keyLevels.prev_day_low) || null,
    tfRows,
    bullish: textArray(confluence.bullish_confluence || confluence.bullish_factors || []),
    bearish: textArray(confluence.bearish_confluence || confluence.bearish_factors || []),
    risks: textArray(raw.risk_factors || raw.risk_assessment || []),
    catalysts: textArray(raw.catalyst_watch || raw.catalyst_context || raw.market_context || []),
    execution,
    actionItems: [
      ...textArray(checklist.immediate || []),
      ...textArray(checklist.pre_trade || []),
      ...textArray(checklist.monitoring || []),
      ...textArray(execution.action_plan || execution.actions || execution.checklist || [])
    ],
    scenarios,
    primaryScenario: scenarios.find(x => x.key === 'primary_scenario') || null,
    alternativeScenario: scenarios.find(x => x.key === 'alternative_scenario') || null,
    invalidationScenario: scenarios.find(x => x.key === 'invalidation_scenario') || null
  };
}

// SELF-HEALING FETCH (SỬA LỖI JSON TỪ MAKE.COM TỰ ĐỘNG)
// ============================================================
const MAX_REPORTS = 50;
const STORAGE_KEY = 'kenvinzone_reports_v2';

function loadFromStorage() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
function saveToStorage(reports) {
  let attempt = reports.slice(0, MAX_REPORTS);
  for (let i = 0; i < 4; i++) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(attempt)); return; }
    catch { attempt = attempt.slice(0, Math.floor(attempt.length * 0.7)); }
  }
}

async function tryFetch(url) {
  try {
    const res = await fetch(url + '?t=' + Date.now());
    if (!res.ok) return [];
    let text = await res.text();
    // Self-heal common Make.com stray comma bug: "raw":,{ -> "raw":{
    text = text.replace(/"raw"\s*:\s*,\s*\{/g, '"raw":{');
    const json = JSON.parse(text);
    if (Array.isArray(json)) return json;
    if (Array.isArray(json.reports)) return json.reports;
    return [json];
  } catch (e) {
    console.warn('Fetch/Parse fallback for', url, e);
    return [];
  }
}

async function loadReports(showToast = false) {
  const [freshRaw, historyRaw] = await Promise.all([
    tryFetch('reports.json'),
    tryFetch('history.json')
  ]);

  const storedRaw = loadFromStorage();
  const seen = new Set();
  const mergedRaw = [...freshRaw, ...historyRaw, ...storedRaw].filter(r => {
    const id = r && (r.id || r.datetime);
    if (!id || seen.has(id)) return false;
    seen.add(id);
    return true;
  }).slice(0, MAX_REPORTS);

  saveToStorage(mergedRaw);

  const seen2 = new Set();
  const newReports = mergedRaw.map(normalizeReport).filter(Boolean)
    .filter(r => { if (seen2.has(r.id)) return false; seen2.add(r.id); return true; })
    .sort((a, b) => new Date(b.datetime) - new Date(a.datetime));

  if (showToast && newReports.length > 0 && lastReportId && newReports[0].id !== lastReportId) {
    showAppToast(`🔔 Báo cáo mới: ${newReports[0].instrument} · ${newReports[0].bias}`, () => {
      selectedId = newReports[0].id;
      renderList(); renderContent(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
  if (newReports.length > 0) lastReportId = newReports[0].id;

  allReports = newReports;
  availableMonths = [...new Set(allReports.map(r => r.monthKey))].sort().reverse();
  updateMonthSelector();

  if (allReports.length > 0) {
    document.getElementById('lastUpdated').textContent = fmtRelativeTime(allReports[0].datetime);
  }

  renderFilters();
  applyFilters();
  if (!selectedId && filteredReports.length) selectedId = filteredReports[0].id;
  if (filteredReports.length && !filteredReports.some(r => r.id === selectedId)) selectedId = filteredReports[0].id;

  renderList();
  renderContent();
  updateStats();
  updateFabBadge();
}

  if (!prev) sel.value = 'all';
}

function isInTimeRange(r, range) {
  const now = new Date(), d = r.dateObj;
  if (range === 'today') return d.toDateString() === now.toDateString();
  if (range === 'week') { const w = new Date(now); w.setDate(w.getDate() - 7); return d >= w; }
  if (range === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  return true;
}
function matchSearch(r, q) {
  if (!q) return true;
  const s = q.toLowerCase();
  return [r.instrument, r.bias, r.headline, r.insight, r.archetype, ...r.bullish, ...r.bearish, ...r.risks, ...r.catalysts]
    .some(x => String(x).toLowerCase().includes(s));
}
function applyFilters() {
  const m = document.getElementById('monthSelect')?.value || 'all';
  filteredReports = allReports.filter(r => {
    if (filters.instrument !== 'all' && r.instrument !== filters.instrument) return false;
    if (filters.bias !== 'all' && r.biasClass !== filters.bias) return false;
    if (filters.time !== 'all' && !isInTimeRange(r, filters.time)) return false;
    if (m !== 'all' && m !== '' && r.monthKey !== m) return false;
    return matchSearch(r, filters.search);
  });
}
function updateStats() {

function primaryScenarioHero(r, s) {
  if (!s) return `<div class="scenario-card"><div style="color:var(--kz-muted)">Chưa có kịch bản chính</div></div>`;
  const prob = Math.min(100, Math.max(0, Math.round(s.probability || 0)));
  const biasCls = getBiasClass(s.bias);

  // Conviction tier driven by probability (65%+ High, 75%+ Ultra A+ Setup!)
  let tierCls = 'tier-mod';
  let pillCls = 'mod';
  let pillText = L('pillMod');
  let ringColor = '#F3BE62';
  if (prob >= 75) {
    tierCls = 'tier-ultra';
    pillCls = 'ultra';
    pillText = L('pillUltra')(prob);
    ringColor = biasCls === 'bearish' ? '#FB7185' : '#34D399';
  } else if (prob >= 65) {
    tierCls = 'tier-high';
    pillCls = 'high';
    pillText = L('pillHigh')(prob);
    ringColor = '#38D5E7';
  }

  const radius = 36;
  const circ = +(2 * Math.PI * radius).toFixed(2);
  const targetOffset = +(circ * (1 - prob / 100)).toFixed(2);

  return `
    <div class="sc-primary-wrap ${tierCls}">
      <div class="sc-primary-card" data-primary-card>
        <div class="sc-top-bar">
          <div>
            <span class="sc-conviction-pill ${pillCls}">${pillText}</span>
            <div class="sc-bias-hero ${biasCls}">${getBiasIcon(biasCls)} ${esc(s.bias)}</div>
          </div>
          <div class="prob-ring-box" title="${L('probLbl')}: ${prob}%">
            <svg class="prob-ring-svg" viewBox="0 0 88 88" aria-hidden="true">
              <circle class="prob-ring-bg" cx="44" cy="44" r="${radius}"></circle>
              <circle class="prob-ring-fg" cx="44" cy="44" r="${radius}"
                stroke="${ringColor}"
                stroke-dasharray="${circ}"
                stroke-dashoffset="${circ}"
                data-ring-target="${targetOffset}"></circle>
            </svg>
            <div class="prob-ring-text">
              <span class="prob-ring-num" data-count-prob="${prob}">0%</span>
              <span class="prob-ring-lbl">${L('probLbl')}</span>
            </div>
          </div>
        </div>

        <div class="sc-setup-box">${esc(s.setup)}</div>

        <div class="trade-visual">
          <div class="trade-vis-labels">
            <div class="tv-cell"><span class="tv-k">${L('slLbl')}</span><span class="tv-v sl">${esc(s.stop)}</span></div>
            <div class="tv-cell center"><span class="tv-k">${L('rrLbl')}</span><span class="tv-v rr">${esc(s.rr)}</span></div>
            <div class="tv-cell right"><span class="tv-k">${L('tpLbl')}</span><span class="tv-v tp">${esc(s.target)}</span></div>
          </div>
          <div class="tv-track" aria-hidden="true">
            <div class="tv-risk-seg"></div>
            <div class="tv-reward-seg"></div>
          </div>
        </div>

        <div class="sc-primary-foot">
          <span class="mono" style="font-size:11px;color:var(--kz-muted)">
            ${prob >= 75 ? L('footUltra') : prob >= 65 ? L('footHigh') : L('footMod')}
          </span>
          <button type="button" class="kz-btn primary" id="copyPlanBtn" style="padding:7px 12px;font-size:12px">${L('copyPlan')}</button>
        </div>
      </div>
    </div>`;
}

function scenarioCard(label, cls, s) {
  if (!s) return `<div class="scenario-card ${cls}"><div class="scenario-type ${cls}">${esc(label)}</div><div style="color:var(--kz-muted);font-size:12.5px">—</div></div>`;
  const prob = Math.min(100, Math.max(0, Math.round(s.probability || 0)));
  return `
    <div class="scenario-card ${cls}">
      <div class="sc-sec-head">
        <div class="scenario-type ${cls}">${esc(label)}</div>
        <span class="sc-sec-prob">${prob}%</span>
      </div>
      <div class="scenario-bias ${getBiasClass(s.bias)}">${getBiasIcon(getBiasClass(s.bias))} ${esc(s.bias)}</div>
      <div class="scenario-setup">${esc(s.setup)}</div>
      <div class="scenario-stats">
        <div><div class="stat-label">${L('tpShort')}</div><div class="stat-value green">${esc(s.target)}</div></div>
        <div><div class="stat-label">${L('slShort')}</div><div class="stat-value red">${esc(s.stop)}</div></div>
        <div><div class="stat-label">R / R</div><div class="stat-value gold">${esc(s.rr)}</div></div>
      </div>
      <div class="prob-track"><div class="prob-fill ${cls}" data-pct="${prob}"></div></div>
    </div>`;
}

function buildBiasSparkline(reports, instrument) {
  const series = reports.filter(x => x.instrument === instrument).slice(0, 10).reverse()
    .map(x => x.biasClass === 'bullish' ? 1 : x.biasClass === 'bearish' ? -1 : 0);
  if (series.length < 2) return '';
  const w = 170, h = 34, pad = 3;
  const stepX = (w - pad * 2) / (series.length - 1);
  const pts = series.map((v, i) => `${(pad + i * stepX).toFixed(1)},${(h / 2 - v * (h / 2 - pad)).toFixed(1)}`).join(' ');
  const lastV = series[series.length - 1];
  const color = lastV > 0 ? '#34D399' : lastV < 0 ? '#FB7185' : '#38D5E7';
  return `
    <svg class="hero-sparkline" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <defs><linearGradient id="spG" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.32"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="${pts} ${w-pad},${h} ${pad},${h}" fill="url(#spG)"/>
    </svg>`;
}

function buildPriceLadder(r) {
  const items = [];
  if (r.prevDayHigh) items.push({ label: 'Prev High', cls: 'ref', val: r.prevDayHigh });
  r.resistanceNums.forEach((v, i) => items.push({ label: L('resLbl')(i+1), cls: 'resistance', val: v }));
  if (r.price) items.push({ label: L('curLbl'), cls: 'current', val: r.price });
  r.supportNums.forEach((v, i) => items.push({ label: L('supLbl')(i+1), cls: 'support', val: v }));
  if (r.prevDayLow) items.push({ label: 'Prev Low', cls: 'ref', val: r.prevDayLow });

  items.sort((a, b) => b.val - a.val);
  const vals = items.map(x => x.val);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const span = Math.max(0.01, maxV - minV);

  return items.map(i => {
    const pct = Math.max(8, Math.min(100, ((i.val - minV) / span) * 100));
    const barColor = i.cls === 'resistance' ? 'var(--kz-rose)' : i.cls === 'support' ? 'var(--kz-green)' : i.cls === 'current' ? 'var(--kz-gold)' : 'var(--kz-cyan)';
    return `
      <div class="ladder-row ${i.cls}">
        <span class="dot ${i.cls}"></span>
        <span class="level-type">${esc(i.label)}</span>
        <div class="level-bar-wrap"><div class="level-bar" style="width:${pct.toFixed(0)}%;background:${barColor}"></div></div>
        <span class="level-price">${esc(fmtPrice(i.val))}</span>
      </div>`;
  }).join('');
}

          <div class="hero-price-value" id="heroPriceNum" data-target-price="${r.price}">${esc(r.priceFmt)}</div>
          <div class="hero-price-time">${esc(fmtTs(r.datetime))}</div>
          ${buildBiasSparkline(allReports, r.instrument)}
        </div>
      </div>
    </section>

    <!-- 4-Timeframe Alignment Radar -->
    <section class="mtf-radar">${mtfHtml}</section>

    <!-- 3 Trading Scenarios (Flagship Asymmetric Command Stage) -->
    <section class="panel" style="border-color:rgba(243,190,98,0.28)">
      <div class="panel-body">
        <div class="panel-title">${L('secScenarios')}</div>
        <div class="scenarios-stage">
          ${primaryScenarioHero(r, r.primaryScenario)}
          <div class="scenarios-secondary">
            ${scenarioCard(L('altTitle'),'alternative',r.alternativeScenario)}
            ${scenarioCard(L('invTitle'),'invalidation',r.invalidationScenario)}

      </div>
    </section>

    <!-- Visual Price Ladder + Risk Radar + Catalysts -->

      <div class="panel">
        <div class="panel-body">

        window.gsap.to(obj, { v: target, duration: 0.95, ease: 'power3.out', onUpdate: () => { el.textContent = Math.round(obj.v) + '%'; } });

  // Copy Primary Trade Plan button

  if (copyPlanBtn && r.primaryScenario) {

  // Copy Telegram Summary button

      navigator.clipboard?.writeText(r.telegramSummary).catch(() => {});

      spawnSparkles(e.clientX, e.clientY);
    };
  }

  // Checklist handlers
  container.querySelectorAll('.check').forEach(el => {
    el.onclick = (e) => {
      const { report, idx } = el.dataset;
      el.classList.toggle('checked');
      (checklistState[report] ||= {})[idx] = el.classList.contains('checked');
      saveChecklistState(checklistState);
      if (el.classList.contains('checked')) spawnSparkles(e.clientX, e.clientY);
    };
  });
}

function openSheet() { document.getElementById('sheetBackdrop').classList.add('open'); document.getElementById('bottomSheet').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet() { document.getElementById('sheetBackdrop').classList.remove('open'); document.getElementById('bottomSheet').classList.remove('open'); document.body.style.overflow = ''; }
function updateFabBadge() {
  const b = document.getElementById('fabBadge');
  if (!b) return;
  b.textContent = filteredReports.length;
  b.style.display = filteredReports.length > 0 ? 'flex' : 'none';
}
function showAppToast(msg, onClick) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  if (onClick) t.onclick = () => { onClick(); t.remove(); };
  c.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

document.getElementById('fabBtn').addEventListener('click', openSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);
const advToggle = document.getElementById('advFilterToggle');
const advBox = document.getElementById('advFiltersBox');
if (advToggle && advBox) {
  advToggle.addEventListener('click', () => {
    const isCollapsed = advBox.classList.toggle('collapsed');
    advToggle.classList.toggle('open', !isCollapsed);
    advToggle.textContent = isCollapsed ? L('moreFilters') : L('lessFilters');
  });
}
document.getElementById('refreshBtn').addEventListener('click', async () => {
  const b = document.getElementById('refreshBtn');
  b.classList.add('spinning');
  await loadReports(true);
  setTimeout(() => b.classList.remove('spinning'), 500);
  showAppToast(L('refreshed'));
});

document.addEventListener('keydown', (e) => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  const idx = filteredReports.findIndex(r => r.id === selectedId);
  if (e.key === 'j' && idx < filteredReports.length - 1) { selectedId = filteredReports[idx + 1].id; renderList(); renderContent(); }
  else if (e.key === 'k' && idx > 0) { selectedId = filteredReports[idx - 1].id; renderList(); renderContent(); }
  else if (e.key === '/') { e.preventDefault(); document.getElementById('searchInput')?.focus(); }
  else if (e.key === 'Escape') closeSheet();
});

function startPolling() { stopPolling(); pollTimer = setInterval(() => loadReports(true), 60000); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
document.addEventListener('visibilitychange', () => { if (document.hidden) stopPolling(); else { loadReports(true); startPolling(); } });
setInterval(() => { if (allReports.length) document.getElementById('lastUpdated').textContent = fmtRelativeTime(allReports[0].datetime); }, 30000);

const langBtn = document.getElementById('langToggle');
if (langBtn) {
  langBtn.addEventListener('click', () => setLang(currentLang === 'en' ? 'vi' : 'en'));
}
applyStaticLang();
loadReports(false);
startPolling();
</script>
</body>
</html>
